version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthid_postgres
    restart: always
    environment:
      POSTGRES_USER: healthid_user
      POSTGRES_PASSWORD: healthid_password
      POSTGRES_DB: healthid_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: healthid_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
