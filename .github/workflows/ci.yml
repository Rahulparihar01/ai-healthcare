name: HealthID AI CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest "httpx<0.28.0" pytest-asyncio pytest-mock
    - name: Run Pytest
      env:
        SECRET_KEY: "super-secret-key-for-dev-change-in-production

      run: |
        pytest app/tests/
        
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Build PWA
      working-directory: ./frontend
      run: npm run build
